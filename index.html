<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>River Computer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="layout">
    <aside class="rail">
      <header class="rail-header">
        <h1 class="brand"><a href="/" class="brand-link" id="brand-link">River Computer</a></h1>
        <p class="description">River Computer develops coordination surfaces between people, living systems, and machines for pluralist resilience.</p>
      </header>

      <nav class="rail-nav">
        <a href="content/waka.json" data-page>Waka</a>
        <a href="content/pools.json" data-page>Pools</a>
        <a href="content/ecological-institutions.json" data-page>Ecological Institutions</a>
        <a href="content/idk.json" data-page>Institutional Development Kit</a>
      </nav>

      <section class="rail-section">
        <h2 class="section-label">Research</h2>
        <ul class="section-links">
          <li><a href="content/broad-data.json" data-page><span class="link-icon" aria-hidden="true"></span><span class="link-title">Broad Data</span></a></li>
          <li><a href="content/witness-protocols.json" data-page><span class="link-icon" aria-hidden="true"></span><span class="link-title">Witness Protocols</span></a></li>
          <li><a href="content/more-than-human-interfaces.json" data-page><span class="link-icon" aria-hidden="true"></span><span class="link-title">More Than Human Interfaces</span></a></li>
        </ul>
      </section>

      <section class="rail-section">
        <nav class="rail-social">
          <a href="mailto:hello@rivercomputer.org">Email</a>
          <a href="https://x.com" target="_blank" rel="noopener noreferrer">X</a>
          <a href="https://github.com" target="_blank" rel="noopener noreferrer">GitHub</a>
        </nav>

        <div class="newsletter">
          <label class="newsletter-label" for="newsletter-email">Newsletter</label>
          <form class="newsletter-form" id="newsletter-form">
            <input type="email" id="newsletter-email" name="email" placeholder="you@example.com" required autocomplete="email">
            <button type="submit" aria-label="Subscribe">→</button>
          </form>
        </div>
      </section>

      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle light and dark mode">
        <span class="theme-toggle-label">Mode</span>
        <span class="theme-toggle-icon" aria-hidden="true">◐</span>
      </button>
    </aside>

    <div class="content-logo" aria-hidden="true"></div>
    <main class="content" id="content"></main>
  </div>

  <script src="logo.js"></script>
  <script src="app.js"></script>
</body>
</html>
