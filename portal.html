<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <!-- The page moved to /lately when it was named River Computer Lately.
       This stub keeps every /portal link already in someone's inbox working. -->
  <meta http-equiv="refresh" content="0; url=/lately">
  <link rel="canonical" href="https://rivercomputer.com/lately">
  <title>River Computer Lately</title>
  <link rel="stylesheet" href="styles.css?v=6">
  <style>
    .redirect {
      max-width: 640px;
      margin: 0 auto;
      padding: 96px 28px;
      color: var(--fg-muted);
    }

    .redirect a {
      color: var(--fg);
      text-decoration: underline;
      text-underline-offset: 2px;
    }
  </style>
  <script>
    const saved = localStorage.getItem('rc-theme');
    document.documentElement.setAttribute('data-theme', saved === 'light' ? 'light' : 'dark');
    location.replace('/lately');
  </script>
</head>
<body>
  <p class="redirect">This page is now at <a href="/lately">rivercomputer.com/lately</a>.</p>
</body>
</html>
